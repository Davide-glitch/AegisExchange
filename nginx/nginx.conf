events {
    worker_connections 1024;
}

http {
    upstream ingestion_cluster {
        server host.docker.internal:8081 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8082 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8080;

        # Route 1: Order Ingestion Cluster (Round-Robin + ~2s failover to 1A / 1B)
        location /api/orders {
            proxy_pass http://ingestion_cluster;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        # Route 2: Account & Wallet Service (Node-2 :8083)
        location /api/accounts {
            proxy_pass http://host.docker.internal:8083;
        }

        # Route 3: Market Data Service (Node-4 :8087)
        location /api/market/quotes {
            proxy_pass http://host.docker.internal:8087;
        }

        # Route 4: Surveillance Risk Service (Node-5 :8088)
        location /api/surveillance {
            proxy_pass http://host.docker.internal:8088;
        }

        # Route 5: Enforcement Governance Service (Node-6 :8089)
        location /proposals {
            proxy_pass http://host.docker.internal:8089;
        }
    }
}
